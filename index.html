<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskFlow is a responsive task manager built with HTML, CSS and vanilla JavaScript.">
  <title>TaskFlow | Task Manager</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #17251e;
      background: #f3f6f4;
      --green: #176b4a;
      --muted: #65766c;
      --line: #dde6df;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .shell { max-width: 920px; margin: 0 auto; padding: 30px 20px 55px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 34px; }
    .brand { font-size: 23px; font-weight: 800; letter-spacing: -.7px; }
    .brand span { color: var(--green); }
    .pill { font-size: 12px; color: var(--green); background: #e2f0e7; border-radius: 30px; padding: 7px 11px; }
    .hero h1 { font-size: clamp(30px, 5vw, 46px); letter-spacing: -1.7px; margin: 0 0 8px; }
    .hero p { color: var(--muted); margin: 0; line-height: 1.5; }
    .panel { background: white; border: 1px solid var(--line); border-radius: 17px; padding: 22px; margin-top: 24px; box-shadow: 0 10px 32px #163b2410; }
    form { display: grid; grid-template-columns: 1fr 150px auto; gap: 10px; }
    input, select, button { font: inherit; border-radius: 9px; padding: 12px; border: 1px solid var(--line); }
    input:focus, select:focus { outline: 2px solid #90c9a8; outline-offset: 1px; }
    button { border: 0; background: var(--green); color: white; font-weight: 700; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0; }
    .filters button { background: #edf3ef; color: #385447; padding: 8px 13px; }
    .filters button.active { background: var(--green); color: #fff; }
    .stats { display: flex; gap: 20px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 14px 0; }
    .tasks { display: grid; gap: 9px; }
    .task { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 11px; padding: 12px; }
    .task input { accent-color: var(--green); width: 17px; height: 17px; }
    .task .name { flex: 1; overflow-wrap: anywhere; }
    .task.done .name { text-decoration: line-through; color: #839188; }
    .priority { font-size: 11px; background: #f0f3f1; color: #54675c; border-radius: 20px; padding: 5px 9px; }
    .delete { padding: 8px 10px; background: #fff0ed; color: #a23d32; }
    .empty { padding: 35px 10px; text-align: center; color: #7b8c82; }
    .note { font-size: 12px; text-align: center; color: #87948d; margin-top: 18px; }
    @media (max-width: 620px) {
      .shell { padding: 22px 14px 40px; }
      header { margin-bottom: 27px; }
      .panel { padding: 16px; }
      form { grid-template-columns: 1fr 1fr; }
      form input, form button { grid-column: 1 / -1; }
      .task { gap: 8px; }
      .priority { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">taskflow<span>.</span></div>
      <div class="pill">Browser-based demo</div>
    </header>
    <section class="hero">
      <h1>Make room for focused work.</h1>
      <p>A simple task board to capture work, set priorities and track what is done.</p>
    </section>
    <section class="panel" aria-labelledby="task-heading">
      <h2 id="task-heading" style="font-size:19px;margin:0 0 15px">My tasks</h2>
      <form id="task-form">
        <input id="task-name" maxlength="100" placeholder="Add a task..." aria-label="Task name" required>
        <select id="task-priority" aria-label="Priority">
          <option>Normal</option><option>High</option><option>Low</option>
        </select>
        <button type="submit">Add task</button>
      </form>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="active" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <div class="stats" id="stats" aria-live="polite"></div>
      <div class="tasks" id="tasks"></div>
    </section>
    <p class="note">Tasks are saved in this browser only using localStorage. No account or cloud sync.</p>
  </main>
  <script>
    const STORAGE_KEY = "taskflow-demo-v2";
    let tasks = loadTasks();
    let filter = "all";

    const form = document.getElementById("task-form");
    const input = document.getElementById("task-name");
    const priority = document.getElementById("task-priority");
    const list = document.getElementById("tasks");
    const stats = document.getElementById("stats");

    function loadTasks() {
      try {
        const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      render();
    }

    function render() {
      const active = tasks.filter((task) => !task.done).length;
      const completed = tasks.length - active;
      stats.textContent = active + " active · " + completed + " completed · " + tasks.length + " total";

      const visible = tasks.filter((task) =>
        filter === "all" ||
        (filter === "active" && !task.done) ||
        (filter === "completed" && task.done)
      );

      list.replaceChildren();

      if (visible.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nothing here yet. Add a task above.";
        list.append(empty);
        return;
      }

      visible.forEach((task) => {
        const row = document.createElement("div");
        row.className = "task" + (task.done ? " done" : "");
        row.dataset.id = task.id;

        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = task.done;
        check.setAttribute("aria-label", "Mark " + task.name + " complete");
        check.dataset.action = "toggle";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = task.name;

        const tag = document.createElement("span");
        tag.className = "priority";
        tag.textContent = task.priority;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.textContent = "Delete";
        remove.dataset.action = "delete";

        row.append(check, name, tag, remove);
        list.append(row);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) return;

      tasks.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        name,
        priority: priority.value,
        done: false
      });

      input.value = "";
      saveTasks();
      input.focus();
    });

    list.addEventListener("change", (event) => {
      if (event.target.dataset.action !== "toggle") return;
      const row = event.target.closest(".task");
      const task = tasks.find((item) => item.id === row.dataset.id);
      if (task) {
        task.done = event.target.checked;
        saveTasks();
      }
    });

    list.addEventListener("click", (event) => {
      if (event.target.dataset.action !== "delete") return;
      const row = event.target.closest(".task");
      tasks = tasks.filter((task) => task.id !== row.dataset.id);
      saveTasks();
    });

    document.querySelector(".filters").addEventListener("click", (event) => {
      const nextFilter = event.target.dataset.filter;
      if (!nextFilter) return;

      filter = nextFilter;
      document.querySelectorAll(".filters button").forEach((button) => {
        button.classList.toggle("active", button === event.target);
      });
      render();
    });

    render();
  </script>
</body>
</html>
